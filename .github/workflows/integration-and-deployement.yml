name: Integration and Deployment Pipeline

permissions:
  contents: read
  packages: read
  id-token: write # Required for requesting the JWT

on:
  push:
    branches:
      - master

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '20'
          cache-key-suffix: '-v1'
          contract-access-token: ${{ secrets.CONTRACT_ACCESS_TOKEN }}

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.CONTRACT_ACCESS_TOKEN }}'

      - name: Tests
        uses: ./.github/actions/run-tests

  deploy:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy
