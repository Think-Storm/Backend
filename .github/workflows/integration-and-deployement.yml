name: Integration and Deployment Pipeline

permissions:
  contents: read
  packages: read
  id-token: write # Required for requesting the JWT

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          cache-key-suffix: '-v1'
          contract-access-token: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'

      - name: Tests
        uses: ./.github/actions/run-tests
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'
          env-variables: |
            REDIS_USER=${{ secrets.REDIS_USER }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            JWT_COOKIE_EXPIRES_IN=${{ secrets.JWT_COOKIE_EXPIRES_IN }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            SUPABASE_STORAGE_BUCKET=${{ secrets.SUPABASE_STORAGE_BUCKET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            REDIS_CACHING_TTL=${{ secrets.REDIS_CACHING_TTL }}
            REDIS_THROTTLER_URL=${{ secrets.REDIS_THROTTLER_URL }}
            REDIS_CACHING_URL=${{ secrets.REDIS_CACHING_URL }}
            DATABASE_UNIT_TEST_URL=${{ secrets.DATABASE_UNIT_TEST_URL }}
            DATABASE_E2E_TEST_URL=${{ secrets.DATABASE_E2E_TEST_URL }}
            DATABASE_COVERAGE_TEST_URL=${{ secrets.DATABASE_COVERAGE_TEST_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          cache-key-suffix: '-v1'
          contract-access-token: ${{ secrets.NPM_TOKEN }}

      # Migrations used to run from the container entrypoint on every cold
      # start. They run once per deploy here instead, against the direct
      # (session-mode) connection — Prisma CLI cannot migrate over the pooler.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --retry 3 "$RENDER_DEPLOY_HOOK_URL"
