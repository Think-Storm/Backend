name: Global Verification on Schedule

on:
  schedule:
    - cron: '0 8 * * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        uses: ./.github/actions/lint
      - name: Build
        uses: ./.github/actions/build
      - name: Tests
        uses: ./.github/actions/run-tests
