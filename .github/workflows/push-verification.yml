name: Push Verification Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  push-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build
