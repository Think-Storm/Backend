name: Database Verification Job
on:
  workflow_call:
    inputs:
      test-command:
        required: true
        type: string
      db-name:
        required: true
        type: string
    secrets:
      JWT_SECRET:
        required: true
      JWT_EXPIRES_IN:
        required: true
      JWT_COOKIE_EXPIRES_IN:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: ${{ inputs.db-name }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ inputs.db-name }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
      JWT_COOKIE_EXPIRES_IN: ${{ secrets.JWT_COOKIE_EXPIRES_IN }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_THROTTLER_DB: 0
      REDIS_CACHING_DB: 1
      REDIS_CACHING_TTL: 3600
      REDIS_USER: redis_user
      REDIS_PASSWORD: redis_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Configure Redis
        run: |
          # First, create a redis user with a password
          redis-cli -h localhost ACL SETUSER redis_user on ">redis_password" "~*" "+@all"
          
          # Then set the password for the Redis server
          redis-cli -h localhost CONFIG SET requirepass redis_password
          
          # Test the connection with the new user (using AUTH command instead of -u)
          redis-cli -h localhost -a redis_password PING
          
          # Use AUTH command with username parameter (Redis 6.0+ syntax)
          redis-cli -h localhost AUTH redis_user redis_password
          
          # Disable the default user (for extra security)
          redis-cli -h localhost -a redis_password ACL SETUSER default off
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Set up Prisma
        run: npx prisma migrate dev
      - name: Seed the database
        run: npm run db:seed
      - name: Run test command
        run: ${{ inputs.test-command }} 