name: Pre Integration Verification Pipeline

permissions:
  contents: read
  packages: read
  id-token: write # Required for requesting the JWT

on:
  pull_request:
    branches:
      - 'develop'
  workflow_dispatch:
jobs:
  pre-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '20'
          cache-key-suffix: '-v1'
          contract-access-token: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'

      - name: Tests
        id: run-tests
        uses: ./.github/actions/run-tests
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'
          env-variables: |
            REDIS_USER=${{ secrets.REDIS_USER }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            JWT_COOKIE_EXPIRES_IN=${{ secrets.JWT_COOKIE_EXPIRES_IN }}
            ENVELOOP_API_KEY=${{ secrets.ENVELOOP_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            REDIS_CACHING_TTL=${{ secrets.REDIS_CACHING_TTL }}
            REDIS_THROTTLER_URL=${{ secrets.REDIS_THROTTLER_URL }}
            REDIS_CACHING_URL=${{ secrets.REDIS_CACHING_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_UNIT_TEST_URL=${{ secrets.DATABASE_UNIT_TEST_URL }}
            DATABASE_E2E_TEST_URL=${{ secrets.DATABASE_E2E_TEST_URL }}
            DATABASE_COVERAGE_TEST_URL=${{ secrets.DATABASE_COVERAGE_TEST_URL }}

      - name: Check Test Results
        if: steps.run-tests.outputs.test-success != 'true'
        run: |
          echo "Tests failed"
          echo "Failed tests: ${{ steps.run-tests.outputs.failed_tests }}"
          exit 1
