name: Pre Integration Verification Pipeline

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  pre-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build

      - name: Tests
        uses: ./.github/actions/run-tests