name: Pre Integration Verification Pipeline

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  pre-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build

      - name: Tests
        id: run-tests
        uses: ./.github/actions/run-tests

      - name: Check Test Results
        if: steps.run-tests.outputs.test-success != 'true'
        run: |
          echo "Tests failed"
          echo "Failed tests: ${{ steps.run-tests.outputs.failed_tests }}"
          exit 1
