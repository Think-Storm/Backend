name: Pre Integration Verification Pipeline

permissions:
  contents: read
  packages: read
  id-token: write # Required for requesting the JWT

on:
  pull_request:
    branches:
      - 'develop'
  workflow_dispatch:
jobs:
  pre-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '20'
          cache-key-suffix: '-v1'
          contract-access-token: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        uses: ./.github/actions/lint

      - name: Build
        uses: ./.github/actions/build
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'

      - name: Tests
        id: run-tests
        uses: ./.github/actions/run-tests
        with:
          build-args: '--build-arg CONTRACT_ACCESS_TOKEN=${{ secrets.NPM_TOKEN }}'

      - name: Check Test Results
        if: steps.run-tests.outputs.test-success != 'true'
        run: |
          echo "Tests failed"
          echo "Failed tests: ${{ steps.run-tests.outputs.failed_tests }}"
          exit 1

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run AppScan CodeSweep
        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2.1
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
