name: 'Run Tests and Upload Logs'
description: 'Runs Docker Compose tests and captures logs from containers'

# Define inputs to customize the test process
inputs:
  compose-file-app:
    description: 'Path to the base Docker Compose file'
    required: false
    default: 'docker/docker-compose.app.yml'
  compose-file-db:
    description: 'Path to the database Docker Compose file'
    required: false
    default: 'docker/docker-compose.db.yml'
  compose-file-test:
    description: 'Path to the test Docker Compose file'
    required: false
    default: 'docker/docker-compose.test.yml'
  image-name:
    description: 'Name of the pre-built Docker image to use for tests'
    required: false
    default: 'thinkstorm-backend-prod:latest'
  logs-directory:
    description: 'Directory where logs should be stored'
    required: false
    default: 'logs'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'docker-logs'
  retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '2'
  services:
    description: 'Services to collect logs from (comma-separated)'
    required: false
    default: 'postgres_db,redis_db,unit,e2e,cov'
  build-image:
    description: 'Whether to build the image during test (set to false if using pre-built image)'
    required: false
    default: true
  build-args:
    description: 'Additional build arguments to pass to Docker Compose build'
    required: false
    default: ''
  env-variables:
    description: 'Path to the environment file'
    required: true
    default: '.env'

# Define outputs from the test process
outputs:
  test-success:
    description: 'Whether the tests completed successfully'
    value: ${{ steps.check-tests.outputs.success }}
  failed_tests:
    description: 'Whether the tests failed'
    value: ${{ steps.check-tests.outputs.failed_tests }}

# Define how the action runs
runs:
  using: 'composite'
  steps:
    # Step 1: Set image name environment variable
    - name: Configure image name
      shell: bash
      run: |
        # This will be used by Docker Compose
        echo "DOCKER_IMAGE=${{ inputs.image-name }}" >> $GITHUB_ENV
        echo "Using Docker image: ${{ inputs.image-name }}"

    # Step 2: Run Docker Compose
    - name: Run Docker Compose Tests
      shell: bash
      env:
        ENV_VARIABLES: ${{ inputs.env-variables }}
      run: |
        # Use the --build flag only if build-image is true
        echo "${{ inputs.env-variables }}" > .env
        echo "----- Loaded .env -----"
        cat .env
        echo "------------------------"
        if [ "${{ inputs.build-image }}" == "true" ]; then
          docker compose -f ${{ inputs.compose-file-app }} build app-prod ${{ inputs.build-args }}
        fi
        export $(cat .env | xargs) && docker compose -f ${{ inputs.compose-file-db }} -f ${{ inputs.compose-file-test }} up -d --force-recreate > /dev/null 2>&1

    # Step 3: Create logs directory
    - name: Create logs directory
      shell: bash
      run: |
        mkdir -p ${{ inputs.logs-directory }}

    # Step 4: Capture logs from all services
    - name: Capture Container Logs
      shell: bash
      run: |
        # Parse the services input
        IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"

        # Capture logs for each service
        for service in "${SERVICES[@]}"; do
          echo "Capturing logs for $service"
          docker compose -f ${{ inputs.compose-file-db }} -f ${{ inputs.compose-file-test }} logs $service -f -t --no-color --no-log-prefix> ${{ inputs.logs-directory }}/${service}.log &
        done

    # Step 5: Check test container exit codes
    - name: Check test container exit codes
      id: check-tests
      shell: bash
      run: |
        # Parse the services input to find test containers
        IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"

        # Initialize as successful
        ALL_TESTS_PASSED=true

        # Filter out database services
        TEST_SERVICES=()
        for service in "${SERVICES[@]}"; do
          if [[ "$service" != *"db"* ]]; then
            TEST_SERVICES+=("$service")
          fi
        done

        # Wait for all test services to complete
        if ! docker compose -f ${{ inputs.compose-file-db }} -f ${{ inputs.compose-file-test }} wait "${TEST_SERVICES[@]}" ; then
          echo "⚠️ Warning: Error waiting for services to complete"
          ALL_TESTS_PASSED=false
        fi

        # Check exit codes for all test services
        for service in "${TEST_SERVICES[@]}"; do
          EXIT_CODE=$(docker compose -f ${{ inputs.compose-file-db }} -f ${{ inputs.compose-file-test }} ps -q $service | xargs docker inspect $service -f '{{.State.ExitCode}}')
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ Tests in $service passed"
          else
            echo "❌ Tests in $service failed with exit code $EXIT_CODE"
            ALL_TESTS_PASSED=false
            echo "failed_tests=$service" >> $GITHUB_OUTPUT
          fi
        done

        echo "success=$ALL_TESTS_PASSED" >> $GITHUB_OUTPUT

    # Step 6: Upload logs as artifacts
    - name: Upload Docker Logs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.logs-directory }}/
        retention-days: ${{ inputs.retention-days }}

    # Step 7: Cleanup Docker resources
    - name: Cleanup Docker resources
      shell: bash
      run: |
        export $(cat .env | xargs) && docker compose -f ${{ inputs.compose-file-db }} -f ${{ inputs.compose-file-test }} down > /dev/null 2>&1
