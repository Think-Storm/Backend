name: 'Setup Services'
description: 'Sets up PostgreSQL and Redis services with standard configuration'

inputs:
  postgres-db:
    description: 'PostgreSQL database name'
    required: true
  postgres-user:
    description: 'PostgreSQL user'
    default: 'postgres'
  postgres-password:
    description: 'PostgreSQL password'
    default: 'postgres'

outputs:
  database-url:
    description: 'PostgreSQL connection URL'
    value: postgresql://${{ inputs.postgres-user }}:${{ inputs.postgres-password }}@localhost:5432/${{ inputs.postgres-db }}
  redis-host:
    description: 'Redis host'
    value: 'localhost'
  redis-port:
    description: 'Redis port'
    value: '6379'

runs:
  using: "composite"
  steps:
    - name: Setup PostgreSQL
      uses: actions/setup-postgres@v1
      with:
        postgres-version: 'latest'
        ports: 5432
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    - name: Setup Redis
      uses: actions/setup-redis@v1
      with:
        redis-version: 'latest'
        ports: 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5 