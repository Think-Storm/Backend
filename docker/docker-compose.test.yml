services:
  postgres_db:
    image: postgres:latest
    environment:
      POSTGRES_MULTIPLE_DATABASES: unit_test_db, e2e_test_db, coverage_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    container_name: thinkstorm-postgres-db
    ports:
      - '5432:5432'
    volumes:
      - ./database/create-multiple-database.sh:/docker-entrypoint-initdb.d/create-multiple-database.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  unit:
    image: thinkstorm-backend-prod:latest
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@thinkstorm-postgres-db:5432/unit_test_db'
      TYPE: 'unit'
      REDIS_CACHING_TTL: 3600
      REDIS_THROTTLER_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/2'
      REDIS_CACHING_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/3'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN}
      ENVELOOP_API_KEY: ${ENVELOOP_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_db:
        condition: service_healthy
    container_name: unit
    networks:
      - backend-network

  e2e:
    image: thinkstorm-backend-prod:latest
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@thinkstorm-postgres-db:5432/e2e_test_db'
      TYPE: 'e2e'
      REDIS_CACHING_TTL: 3600
      REDIS_THROTTLER_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/0'
      REDIS_CACHING_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/1'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN}
      ENVELOOP_API_KEY: ${ENVELOOP_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_db:
        condition: service_healthy
    container_name: e2e
    networks:
      - backend-network

  cov:
    image: thinkstorm-backend-prod:latest
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@thinkstorm-postgres-db:5432/coverage_test_db'
      TYPE: 'coverage'
      REDIS_CACHING_TTL: 3600
      REDIS_THROTTLER_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/4'
      REDIS_CACHING_URL: 'redis://redis_user:redis_password@thinkstorm-redis-db:6379/5'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN}
      ENVELOOP_API_KEY: ${ENVELOOP_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_db:
        condition: service_healthy
    container_name: cov
    networks:
      - backend-network
