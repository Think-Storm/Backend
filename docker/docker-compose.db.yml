networks:
  backend-network:
    driver: bridge

services:
  postgres_db:
    image: postgres:latest
    container_name: thinkstorm-postgres-db
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis_db:
    image: redis:latest
    container_name: thinkstorm-redis-db
    ports:
      - '6379:6379'
    volumes:
      - ./database/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh
    entrypoint: /usr/local/bin/redis-entrypoint.sh
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', '/usr/local/bin/redis-healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-network
