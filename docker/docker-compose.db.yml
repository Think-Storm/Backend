networks:
  backend-network:
    driver: bridge

services:
  postgres_db:
    image: postgres:latest
    container_name: thinkstorm-postgres-db
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis_db:
    image: redis:latest
    container_name: thinkstorm-redis-db
    ports:
      - '6379:6379'
    volumes:
      - ./database/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly no
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -u redis://redis_user:redis_password@localhost:6379 ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
