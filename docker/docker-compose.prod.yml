services:
  thinkstorm-backend-prod:
    image: thinkstorm-backend-prod:latest
    environment:
      TYPE: production
      DATABASE_URL: 'postgresql://postgres:postgres@thinkstorm-postgres-db:5432/postgres'
      REDIS_HOST: thinkstorm-redis-db
      REDIS_PORT: 6379
      REDIS_THROTTLER_DB: 0
      REDIS_CACHING_DB: 1
      REDIS_CACHING_TTL: 3600
      REDIS_USER: redis_user
      REDIS_PASSWORD: redis_password
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN}
      ENVELOOP_API_KEY: ${ENVELOOP_API_KEY}
    ports:
      - '${HOST_PORT:-3001}:3001'
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_db:
        condition: service_healthy
    networks:
      - backend-network
